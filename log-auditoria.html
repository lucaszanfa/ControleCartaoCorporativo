<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log de Auditoria</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar"></aside>
    <main class="main-content">
      <header class="topbar">
        <div>
          <span class="eyebrow">Administração</span>
          <h1>Log de auditoria</h1>
          <p class="topbar-subtitle">Acompanhe quem criou e editou compras no cartão corporativo, e o que mudou.</p>
        </div>
        <span class="user-chip">Usuário</span>
      </header>

      <section class="card report-filter-card">
        <div class="section-header">
          <div>
            <h2>Filtros</h2>
          </div>
        </div>
        <div class="filters-row filters-four">
          <label>Ação
            <select id="filtroAuditoriaAcao">
              <option value="">Todas</option>
              <option value="criacao">Criação</option>
              <option value="edicao">Edição</option>
            </select>
          </label>
          <label>Usuário
            <select id="filtroAuditoriaUsuario"><option value="">Todos os usuários</option></select>
          </label>
          <label>Data inicial
            <input id="filtroAuditoriaDataInicial" type="date">
          </label>
          <label>Data final
            <input id="filtroAuditoriaDataFinal" type="date">
          </label>
        </div>
        <div class="invoices-filter-actions">
          <button class="btn btn-primary btn-compact" type="button" id="btnFiltrarAuditoria">Filtrar</button>
          <button class="btn btn-secondary btn-compact" type="button" id="btnLimparFiltrosAuditoria">Limpar filtros</button>
        </div>
      </section>

      <section class="card report-workspace-card">
        <div class="section-header">
          <div>
            <h2>Registros de auditoria</h2>
            <p id="auditoriaContagem">0 registros encontrados</p>
          </div>
        </div>
        <div class="table-wrapper">
          <table>
            <thead><tr><th>Data/hora</th><th>Usuário</th><th>Ação</th><th>Compra</th><th>Alterações</th><th></th></tr></thead>
            <tbody id="auditoriaTabela"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="js/dados.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cartoes-utils.js"></script>
  <script src="js/log-auditoria.js"></script>
</body>
</html>
